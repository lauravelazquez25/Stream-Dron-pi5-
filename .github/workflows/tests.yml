name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # la versión de Raspberry Pi OS Bookworm
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v
